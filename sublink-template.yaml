proxy-groups:
  - name: 🚀 手动选择
    type: select
    include-all: true
    filter: "^(?!.*(公告|官网|提示|到期|剩余|有效|群|通知|流量|重置)).*$"
    exclude-filter: "(?i)\\d+(\\.\\d+)?\\s*(倍|x)\\b|倍率|专线"
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡(散列)
      - 🏠 住宅家宽(Home)
      - 🔥 高倍专线(下载/重度)
      - 🌏 南洋节点
      - 🌏 亚洲地区
      - 🇪🇺 欧洲地区
      - 🌎 美洲地区
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🇲🇾 马来西亚节点
      - 🇹🇭 泰国节点
      - 🇵🇭 菲律宾节点
      - 🇮🇩 印尼节点
      - 🇻🇳 越南节点
      - 🇮🇳 印度节点
      - 🇬🇧 英国节点
      - 🇩🇪 德国节点
      - 🇫🇷 法国节点
      - 🇳🇱 荷兰节点
      - 🇹🇷 土耳其节点
      - 🇨🇦 加拿大节点
      - 🇦🇺 澳大利亚节点

  - name: ♻️ 自动选择
    type: url-test
    url: http://cp.cloudflare.com
    interval: 300
    tolerance: 50
    include-all: true
    filter: "^(?!.*(公告|官网|提示|到期|剩余|有效|群|通知|流量|重置)).*$"
    exclude-filter: "(?i)\\d+(\\.\\d+)?\\s*(倍|x)\\b|倍率"

  - name: ⚖️ 负载均衡(散列)
    type: load-balance
    strategy: consistent-hashing
    url: http://cp.cloudflare.com
    interval: 300
    include-all: true
    filter: "(?i)🇭🇰|港|HK|🇸🇬|新加坡|狮城|SG|🇯🇵|日本|JP|🇹🇼|台湾|TW"
    exclude-filter: "(?i)\\d+(\\.\\d+)?\\s*(倍|x)\\b|倍率|公告|官网|提示|到期|剩余|有效|群|通知|流量|重置"

  - name: 🏠 住宅家宽(Home)
    type: url-test
    url: http://cp.cloudflare.com
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)Home"
    exclude-filter: "(?i)🇭🇰|港|HK|Hong Kong|\\d+(\\.\\d+)?\\s*(倍|x)\\b|倍率|公告|官网|提示|到期|剩余|有效|群|通知"

  - name: 🔥 高倍专线(下载/重度)
    type: select
    include-all: true
    filter: "(?i)\\d+(\\.\\d+)?\\s*(倍|x)|倍率|专线"
    exclude-filter: "公告|官网|提示|到期|剩余|有效|群|通知|流量|重置"

  - name: 🌏 南洋节点
    type: url-test
    url: http://cp.cloudflare.com
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|亚特兰大|迈阿密|华盛顿|United States|USA|\\bUS\\b|🇸🇬|新加坡|狮城|Singapore|\\bSG\\b|\\bSGP\\b|🇲🇾|马来西亚|大马|吉隆坡|Malaysia|\\bMY\\b|\\bMYS\\b"
    exclude-filter: "(?i)\\d+(\\.\\d+)?\\s*(倍|x)\\b|倍率"

  - name: 📌 自定义代理
