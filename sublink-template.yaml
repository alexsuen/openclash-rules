# ==============================================================================
# 文件名：sublink-template.yaml
# 适用场景：内网 Sublink Worker 合并双机场节点专用模板
# ==============================================================================

port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: ''

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:category-ads-all": rcode://refused
    "aliyun.gtmdns.com": https://cache.server-nameserver.com:30997/dns-query/fixedtoken
    "fullback-1.timiddns.com": https://cache.server-nameserver.com:30997/dns-query/fixedtoken
    "*.pqjc.site": 223.5.5.5
    "geosite:apple": 223.5.5.5
    "*.apple.com": 223.5.5.5
    "*.icloud.com": 223.5.5.5
    "*.itunes.apple.com": 223.5.5.5
    "*.ls.apple.com": 223.5.5.5
    "*.push.apple.com": 223.5.5.5
    "geosite:cn": 223.5.5.5
  fallback:
    - 8.8.8.8
    - 1.1.1.1
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

rule-providers:
  DIRECT:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_provider/direct.yaml
    url: "https://cdn.jsdelivr.net/gh/alexsuen/openclash-rules@main/direct.yaml"
    interval: 86400
